[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
# コード全体でシングルクォートを使っているので、書き換えて差分を増やさない
quote-style = "preserve"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# radio_batch.py はリポジトリ直下にあるので、bare `pytest` でも import できるようにする
pythonpath = ["."]
testpaths = ["tests"]
