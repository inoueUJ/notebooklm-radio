# ラジオにするフィード。この初期設定のままでも動きます。まずワークフローを 1 回実行してから、
# 自分が追いかけている情報源に置き換えてください。
#
# フィードごとのキー:
#   name:        通知に出る名前
#   url:         RSS/Atom フィードの URL（`type: sitemap` なら sitemap.xml の URL）
#   topic:       記事を入れる日ごとのノートブック。
#                トピックごとに 1 日 1 冊のノートブックと 1 本の音声を作ります。関係のない
#                話題を 1 本のラジオに混ぜると会話がまとまらないので、分けてください。
#   type:        RSS を出していないサイトなら "sitemap"（下のコメントの例を参照）
#   source_mode: 記事の URL を渡しても NotebookLM に中身が届かないときは "text"。取得を
#                ブロックするホストと、1 つの長いページの #位置にリンクする changelog が当てはまります
#   mode:        アグリゲータのように流量の多いフィードなら "latest"。毎回最新の N 本だけを取り、
#                残りはわざと既読にします。既定の "backlog" は古い順に処理し、何も捨てません。
#                下のコメントの例を参照してください。
#
# 何も実行せずに編集を確かめる: python radio_batch.py --check-config
# （CI も、毎回のバッチの前に同じ検査をします。全体の形は config.schema.json にあります）
feeds:
  - name: "GitHub Changelog"
    url: "https://github.blog/changelog/feed/"
    topic: "Infra"
  - name: "Cloudflare"
    url: "https://blog.cloudflare.com/rss/"
    topic: "Infra"
  # すべての項目が 1 つの長いページの #位置にリンクしている changelog。URL で渡すと、
  # NotebookLM は版ごとに履歴全体を取り込みます。`source_mode: text` なら、項目ごとの
  # テキストを投入します（このフィードには、各版のリリースノートの全文が入っています）。
  - name: "Claude Code"
    url: "https://code.claude.com/docs/en/changelog/rss.xml"
    topic: "AI"
    source_mode: text

  # RSS のないサイト: sitemap.xml を指定し、URL のプレフィックスを選びます。
  # サイトマップの既読は、透かしではなく既読 URL の集合で管理します。古い記事を編集すると
  # <lastmod> が新しくなり、透かしで判定すると「新着」としてよみがえるからです。
  # 詳しい理由は docs/DESIGN.md にあります。
  # - name: "Anthropic"
  #   type: sitemap
  #   url: "https://www.anthropic.com/sitemap.xml"
  #   prefix: "https://www.anthropic.com/news/"
  #   topic: "AI"

  # 記事ページが、ブラウザ以外のクライアントにボット確認（Cloudflare の「Just a moment...」など）を
  # 返すホスト。NotebookLM の取得処理は、記事ではなく確認ページを保存してしまいます。
  # `source_mode: text` なら、URL ではなくフィードの項目のテキストをテキストのソースとして
  # 投入するので、取得処理を通りません。
  # このフィードには要約しか入っていないので、ラジオが知るのも要約だけです。ソースの本文にも
  # そう明記し、通知でも要約だけの記事として印を付けます。
  # （1 つの長いページの #位置にリンクする changelog も、同じ設定で直ります。URL で渡すと、
  # 項目ごとにページ全体を取り込むからです。そうしたフィードには各項目の全文が入っていて、
  # ソースにもそう明記します。）
  # ブラウザの User-Agent を偽装して回避することは、あえてしません。相手のボット対策を
  # すり抜けることになるからです。このプロジェクトは、中身が少なくなるほうを選びます。
  # - name: "OpenAI"
  #   url: "https://openai.com/news/rss.xml"
  #   topic: "AI"
  #   source_mode: text

  # アグリゲータは月に数百本を出します。1 回 `limits.per_feed` 本ずつ古い順に処理すると、
  # 1 週間前の記事を永遠に流し続けることになります。`mode: latest` は毎回最新の N 本を取り、
  # 残りを既読にします。「処理していない記事を既読にしない」に対する、フィードごとの
  # 明示的な例外です（docs/DESIGN.md）。
  # - name: "Hacker News front page"
  #   url: "https://hnrss.org/frontpage"
  #   topic: "News"
  #   mode: latest

# トピックごとの上書き（任意）。キーは feeds[].topic で使うトピック名です。
# ここの `audio` の中身は、そのトピックについてだけ `settings.audio` を上書きします。changelog の
# 多いトピックは短い "brief" に、AI のニュースは長い deep-dive に、といった使い分けができます。
# format: deep-dive（既定）| brief | critique | debate
# topics:
#   AI:
#     audio:
#       format: deep-dive
#       length: long
#   Infra:
#     audio:
#       format: brief
#       length: default
#       prompt: >-
#         変更点だけを簡潔に。何が変わり、使う側は何をすればよいかに絞ること。

# ページの更新を見張る（webhook に知らせるだけで、ラジオにはしません）。
# sitemap.xml を指定すると、一致する URL が現れたときや、<lastmod> が変わったときに知らせます。
# `keywords` は URL のスラッグで絞り込み、知らせすぎを防ぎます（空ならプレフィックスの下をすべて）。
# watch:
#   - name: "Claude support"
#     url: "https://support.claude.com/sitemap.xml"
#     prefix: "https://support.claude.com/en/articles/"
#     keywords: [pricing, usage, limit]

# 週次点検（.github/workflows/weekly-check.yml）は、フィードの健康状態と、流したものと
# フィードが出したものの突き合わせを知らせます。recall: true にすると、どのフィードにも
# 載らなかったその週の公式発表を、NotebookLM の Deep Research に探させます
# （Deep Research を週に 1 回使います）。
# weekly_check:
#   recall: true

settings:
  # {topic} と {date} が埋められます。例: "Tech Radio AI 2026-08-31"
  # 古いノートブックの削除は、タイトルがこの形式に完全に一致するものだけが対象なので、
  # 手で作ったノートブックが消えることは構造上ありません。
  notebook_title_format: "Tech Radio {topic} {date}"

  # Audio Overview の言語。NotebookLM が対応している言語ならどれでも使えます（ja、en など）。
  language: "ja"

  # ノートブックの日付と月次の点検に使うタイムゾーン。GitHub のランナーは UTC なので、
  # これがないと朝の回の記事が前日の日付になります。
  timezone: "Asia/Tokyo"

  # `topic` のないフィードの記事を入れるトピック。
  default_topic: "AI"

  # 1 回の実行で扱う記事の数。ソースは 1 本ずつ順に待つので、`total` を上げると
  # ワークフローの 30 分の制限時間を食います。上限を超えた記事は捨てずに未読のまま残し、
  # 次の回に古い順で処理します。
  limits:
    per_feed: 3
    total: 15

  # フィードを取得するときに送る User-Agent。自分のリポジトリを指しておくと、
  # フィードの運営者が、誰が取得しているのかを確かめられます。
  # user_agent: "notebooklm-radio/1.0 (+https://github.com/YOU/YOUR-REPO)"

  # Audio Overview の設定（topics.<name>.audio が、トピックごとに上書きします）。
  #   format: deep-dive（既定）| brief | critique | debate
  #   length: short | default | long
  #   scope:  run（既定）— その回に追加した記事だけで 1 本を作るので、夕方の回が
  #           朝の記事を繰り返しません。
  #           notebook — その日のノートブックのすべてのソースから作ります。
  #   prompt: 話し方の指示。`language` と同じ言語で書いてください。
  audio:
    length: "long"
    prompt: >-
      対談形式で。各ニュースの表面的な紹介ではなく、「なぜ今このタイミングで出たのか」と
      開発者の日常に何が変わるかを深掘りすること。件数を網羅するより、重要な話題を
      選んで掘り下げてよい。

  # このバッチが作った日ごとの古いノートブックを、自動で削除します。
  # dry_run: true のあいだは、削除せずに削除対象の一覧を webhook に送ります。
  # 通知で一覧が正しいことを確かめるまでは true のままにし、それから false にしてください。
  cleanup:
    enabled: true
    retention_days: 7
    dry_run: true

  # 毎月 1 日に、この日数のあいだ新着がないフィードを知らせます
  # （止まったフィードや、黙って変わったサイトの構造を見つけるため）。
  stale_feed_days: 30
