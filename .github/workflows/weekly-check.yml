name: Weekly check

# 週に 1 回: フィードの健康状態、流したものとフィードが出したものの突き合わせ、
# （config.yaml に weekly_check.recall: true があれば）どのフィードにも載らなかった公式発表の
# Deep Research による検査。通知は 1 通にまとめる。
# リポジトリには書き込まない（state.json を書き換えない）。
on:
  schedule:
    # 日曜 12:10 JST（時刻は Asia/Tokyo、UTC+9 で考えている）。急ぐものではなく
    # （GitHub は数時間遅れて始めることがある）、毎日の実行から離してあるので、
    # 月曜の朝には報告が届いている。
    - cron: '10 3 * * 0'
  workflow_dispatch:       # 手動実行

permissions:
  contents: read

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Deep Research は 15〜30 分かかる。ほかはおよそ 1 分。
    timeout-minutes: 60

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          # バッチと同じ理由: notebooklm-py が同じプロセスツリーで動く。
          persist-credentials: false

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Python の依存関係を入れる
        run: pip install -r requirements.txt

      - name: uv を入れる
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: notebooklm-py を入れる
        run: |
          # PATH に足すのは $HOME/.local/bin だけ（バッチのワークフローを参照）。
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv tool install "$(grep -E '^notebooklm-py' requirements-notebooklm.txt)"

      - name: 環境を確かめる
        run: |
          python -c "import feedparser, yaml, httpx; print('pip の依存関係 OK')"
          command -v notebooklm

      - name: 週次点検
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python scripts/weekly_check.py
