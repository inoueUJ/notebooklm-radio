name: RSS Radio Automation

on:
  schedule:
    # 自分の朝に合う時刻を選ぶ（下の時刻は Asia/Tokyo、UTC+9 で考えている）。
    # 朝の回は、夜のあいだに出た発表を集める。音声の生成（約 20 分）が聞き始める前に
    # 終わるよう、早めにする。
    # GitHub は混んでいると定時の実行を遅らせ、数時間遅れることもある。2026-09 以降、作者の
    # 実行は日本時間の早朝で 1.5〜2.5 時間、午後で 3.5〜8.5 時間遅れて始まっている。聞く時刻より
    # かなり前に設定すること（定時に始まれば、早く終わるだけ）。手動実行（workflow_dispatch）は遅れない。
    # ちょうど 0 分・30 分は避ける。GitHub の cron はそこが混み、実行が遅れる。
    - cron: '50 21 * * *'  # 06:50 JST — 夜のあいだ（米国の昼）の発表を拾う
    - cron: '15 8 * * *'   # 17:15 JST — 日本・欧州の昼の発表を拾う
  workflow_dispatch:       # 手動実行

# 既定は読み取りだけ。state.json を push するジョブだけが書き込みの権限を持つ。
permissions:
  contents: read

# 手動実行と定時の実行が重なると、ラジオを二重に作り、state.json の push も取り合いになる。
concurrency:
  group: rss-radio
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 開発用の依存関係を入れる
        run: pip install -r requirements-dev.txt

      - name: uv を入れる
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: notebooklm-py を入れる（CLI の契約テスト用）
        run: |
          # PATH に足すのは $HOME/.local/bin だけ（下のバッチのジョブを参照）。
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv tool install "$(grep -E '^notebooklm-py' requirements-notebooklm.txt)"

      - name: lint
        run: |
          ruff check .
          ruff format --check .

      - name: テスト
        run: pytest -q

      - name: config.yaml を検査する
        # 読み取りだけ: ネットワーク・NotebookLM・state.json には触らない。config.yaml の打ち間違いは、
        # バッチの中で黙って既定値に戻るのではなく、ここで読めるメッセージを出して止まる。
        run: python radio_batch.py --check-config

      - name: テスト・lint の失敗を知らせる
        # これがないと、ゲートが失敗したときにバッチが黙って飛ばされ、ラジオもメッセージも
        # 何も届かない（2026-08 に 25 回分がこうして消えた）。
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          url = os.environ['NOTIFY_WEBHOOK_URL']
          text = "🚨 テスト/lint が失敗したので、今回の batch は実行されていないよ（ラジオは生成されない）\n" + os.environ['RUN_URL']
          key = 'content' if 'discord.com' in url else 'text'
          req = urllib.request.Request(url, data=json.dumps({key: text}).encode(), headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req, timeout=15)
          EOF

  run-batch:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # state.json をリポジトリに push するために必要

    steps:
      - name: 必要なシークレットを確かめる
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          # 後で分かりにくい CLI のエラーになる前に、読めるメッセージですぐに止める。
          if [ -z "$NOTEBOOKLM_AUTH_JSON" ]; then
            echo "::error::NOTEBOOKLM_AUTH_JSON シークレットが設定されていません。手元で python3 scripts/setup.py を実行してください（README のクイックスタートを参照）"
            exit 1
          fi
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "::warning::NOTIFY_WEBHOOK_URL シークレットが設定されていません。バッチは動きますが、エラーの報告も含めて Slack/Discord の通知は届きません。"
          fi
          echo "シークレットは揃っています。"

      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          # バッチの実行中に、書き込み用のトークンを .git/config に残さない。
          # notebooklm-py は同じプロセスツリーで動く第三者のコードで、それを読めてしまう。
          persist-credentials: false

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Python の依存関係を入れる
        run: pip install -r requirements.txt

      - name: uv を入れる
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: notebooklm-py を入れる
        run: |
          # notebooklm コマンドは ~/.local/bin に入る。
          # uv 内部の venv の bin を PATH に足さないこと。上で pip が入れたパッケージが隠れて、
          # feedparser/httpx/yaml を import できなくなる。
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # 版は requirements-notebooklm.txt にある（Dependabot はそこを上げる）。
          uv tool install "$(grep -E '^notebooklm-py' requirements-notebooklm.txt)"

      - name: 環境を確かめる
        run: |
          # 上に書いた PATH の隠れが、再び起きていないかを確かめる。
          python -c "import feedparser, yaml, httpx; print('pip の依存関係 OK')"
          command -v notebooklm

      - name: バッチを実行する
        id: batch
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python radio_batch.py

      - name: state.json が変わっていればコミットして push する
        # バッチが失敗したときも動かす。main() は 0 以外で終わる前に、成功したトピックの既読を
        # 保存している。ここで push を飛ばすと、失敗した回のたびに同じページ更新の通知を送り直し、
        # 成功したトピックも処理し直していた。キャンセルされたときと、バッチが動かなかったときは動かさない。
        # bot の push は GITHUB_TOKEN で行うので、ワークフローを起動しない（[skip ci] は要らない）。
        if: ${{ !cancelled() && (steps.batch.outcome == 'success' || steps.batch.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json は変わっていないので、push するものはありません。"
            exit 0
          fi
          git commit -m "chore: 既読の記録を更新"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$REMOTE" "${GITHUB_REF_NAME}"
          git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"
