name: CI

# push と pull request のたびに、lint・テスト・notebooklm CLI の契約を確かめる（Dependabot の
# 版上げも含む）。バッチのワークフローも毎回同じ検査をするが、定時の実行のときだけなので、
# これがないと更新の PR が確かめられないまま残る。NotebookLM・webhook・state.json には触らない。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 開発用の依存関係を入れる
        run: pip install -r requirements-dev.txt

      - name: uv を入れる
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: notebooklm-py を入れる（CLI の契約テスト用）
        run: |
          # PATH に足すのは $HOME/.local/bin だけ（rss-radio.yml を参照）。
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv tool install "$(grep -E '^notebooklm-py' requirements-notebooklm.txt)"

      - name: lint
        run: |
          ruff check .
          ruff format --check .

      - name: テスト
        run: pytest -q

      - name: config.yaml を検査する
        run: python radio_batch.py --check-config
