name: CI

# Lint, tests and the notebooklm CLI contract on every push and pull request, Dependabot's
# version bumps included. The batch workflow runs the same checks before each run, but only
# on its schedule, so an update PR would otherwise go unchecked. Never touches NotebookLM,
# the webhook or state.json.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Install notebooklm-py (for the CLI contract test)
        run: |
          # Only $HOME/.local/bin goes on PATH (see rss-radio.yml).
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv tool install "$(grep -E '^notebooklm-py' requirements-notebooklm.txt)"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Validate config.yaml
        run: python radio_batch.py --check-config
