# notebooklm-py（requirements-notebooklm.txt）、バッチの Python パッケージ、GitHub Actions を
# 新しく保つ。notebooklm-py は非公式で変わり続ける Google の API を使っていて、2026-10-02 に
# バッチが壊れたのは、上流がもう修正を出していたのに古い版のままだったから。
# 更新はそれぞれ PR として届き、ci.yml がテストと CLI の契約の確認を行い、人がマージする
# （このコードはセッションの Cookie と一緒に動くので、版を自動では上げない）。
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # pytest と ruff の更新は 1 本の PR にまとめる。notebooklm-py とバッチのパッケージは別々のまま
      dev-tools:
        patterns: ['pytest*', 'ruff']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: 'chore(deps)'
